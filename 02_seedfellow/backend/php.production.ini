; php.production.ini
; Layered over PHP's own php.ini-production, which the image already uses.

; The answer does not need to say which PHP wrote it.
expose_php = Off

; OPcache keeps every compiled file in memory. PHP 8.5 always has it; these size it for a
; Laravel application and its packages.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The code is baked into the image and never changes under a running container, so PHP
; never has to look at a file's modification time again. A new release is a new container.
opcache.validate_timestamps = 0
