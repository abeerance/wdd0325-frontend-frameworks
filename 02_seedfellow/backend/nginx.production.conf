# nginx.production.conf
# Laravel's published nginx block, with php-fpm reached by its compose service name.
server {
    listen 8080;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;

    # PHP refuses uploads over 1 MB with a JSON 422. nginx must let the request that far,
    # or it answers a larger one with an HTML 413 of its own.
    client_max_body_size 8m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Only index.php goes to php-fpm. No other PHP file can be run by naming it in a URL.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # /.env and every other dotted path is refused here, before the application is asked.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
